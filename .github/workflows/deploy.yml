name: Deploy yt-relay

on:
  push:
    branches:
      - main

concurrency:
  group: yt-relay-production
  cancel-in-progress: false

jobs:
  test:
    name: Test Self-hosted Runner
    runs-on: self-hosted
    steps:
      - name: Check runner
        run: |
          set -e
          echo "===== RUNNER INFO ====="
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo ""
          echo "===== DOCKER ====="
          echo "docker --version"
          echo "docker compose version"
          echo ""
          echo "===== CONTAINERS ====="
          echo "docker ps"

  deploy:
    name: Deploy yt-relay
    runs-on: self-hosted
    needs: test
    steps:
      - name: Deploy application
        run: |
          set -e
          echo "===== DEPLOY START ====="
          cd ~/yt-relay
          echo "===== GIT ====="
          git fetch origin
          git reset --hard origin/main
          echo "===== DOCKER BUILD ====="
          docker compose build
          echo "===== DOCKER DEPLOY ====="
          docker compose up -d
          echo "===== CONTAINER STATUS ====="
          docker compose ps
          echo "===== HEALTH CHECK ====="

          MAX_RETRIES=15
          RETRY_COUNT=0

          while true; do
            STATUS=$(docker inspect yt-relay --format='{{.State.Health.Status}}')

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy"
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Application is unhealthy"

              echo ""
              echo "===== CONTAINER LOGS ====="
              docker compose logs --tail=100

              exit 1
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))

            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Health check timeout"

              echo ""
              echo "===== CONTAINER LOGS ====="
              docker compose logs --tail=100

              exit 1
            fi

            sleep 2
          done

          echo ""
          echo "===== DEPLOY SUCCESS ====="
