name: Deploy yt-relay

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yt-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy yt-relay
    runs-on: self-hosted
    steps:
      - name: Deploy application
        run: |
          set -e
          echo "===== DEPLOY START ====="
          cd ~/yt-relay

          echo "===== GIT SYNC ====="
          git fetch origin main
          git reset --hard origin/main

          echo "===== DOCKER BUILD ====="
          docker compose build

          echo "===== DOCKER DEPLOY ====="
          docker compose up -d --remove-orphans

          echo "===== CONTAINER STATUS ====="
          docker compose ps

          echo "===== HEALTH CHECK ====="

          MAX_RETRIES=15
          RETRY_COUNT=0

          while true; do
            STATUS=$(docker inspect yt-relay --format='{{.State.Health.Status}}' 2>/dev/null || echo "starting")

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy"
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Application is unhealthy"

              echo ""
              echo "===== CONTAINER LOGS ====="
              docker compose logs --tail=100

              exit 1
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))

            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Health check timeout after ${MAX_RETRIES} retries"

              echo ""
              echo "===== CONTAINER LOGS ====="
              docker compose logs --tail=100

              exit 1
            fi

            sleep 2
          done

          echo ""
          echo "===== CLEANUP ====="
          docker image prune -f

          echo ""
          echo "===== DEPLOY SUCCESS ====="
