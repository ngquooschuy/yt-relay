name: Deploy yt-relay

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          set -e

          echo "===== DEPLOY START ====="

          cd ~/yt-relay

          echo "===== GIT ====="
          git fetch origin
          git reset --hard origin/main

          echo "===== DOCKER BUILD ====="
          docker compose build

          echo "===== DOCKER DEPLOY ====="
          docker compose up -d

          echo "===== CONTAINER STATUS ====="
          docker compose ps

          echo "===== HEALTH CHECK ====="

          MAX_RETRIES=10
          RETRY_COUNT=0

          until curl -fsS http://127.0.0.1:3000 > /dev/null; do
            RETRY_COUNT=$((RETRY_COUNT + 1))

            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Health check failed after $MAX_RETRIES attempts"
              echo ""
              echo "===== CONTAINER LOGS ====="
              docker compose logs --tail=100
              exit 1
            fi

            echo "Application is not ready yet..."
            echo "Retry $RETRY_COUNT/$MAX_RETRIES"

            sleep 2
          done

          echo "Application is healthy"

          echo ""
          echo "===== DEPLOY SUCCESS ====="
