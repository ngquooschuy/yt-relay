on:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Check runner
        run: |
          echo "===== RUNNER INFO ====="
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"

          echo ""
          echo "===== DOCKER ====="
          echo "docker --version"
          echo "docker compose version"

          echo ""
          echo "===== CONTAINERS ====="
          echo "docker ps"
