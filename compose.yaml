services:
  yt-relay:
    build:
      context: .
    container_name: yt-relay
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

    ports:
      - "127.0.0.1:3000:3000"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M
